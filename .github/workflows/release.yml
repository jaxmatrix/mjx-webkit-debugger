# Release binaries for tagged versions (T-015).
#
# Push a tag matching `v*` (e.g. `v0.1.0`) to build archives for every target
# listed in `dist-workspace.toml`, attach SHA-256 checksums, and refuse to ship
# if the workspace links a webview.
#
# Config contract: dist-workspace.toml (this workflow implements it).

name: Release

on:
  push:
    tags:
      - "v*"
  # Manual dry-run: builds + checksums as artifacts, skips creating a Release.
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  PACKAGE: mjx-webkit-debugger
  BIN: mjx-webkit-debugger

jobs:
  # The claim on the tin: a shipped binary must never contain a webview.
  # Runs before any platform build so a regression fails the release early.
  verify-no-webview:
    name: verify-no-webview
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-verify-no-webview
      # Transport links glib for the WebKitGTK inspector SocketConnection handshake.
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-dev pkg-config \
            libxkbcommon-dev libwayland-dev libxcb1-dev \
            libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev
      - name: No webview in the dependency graph
        run: cargo run -p xtask -- verify-no-webview

  build:
    name: build (${{ matrix.name }})
    needs: verify-no-webview
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive_ext: tar.gz
          - name: linux-aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            archive_ext: tar.gz
          - name: macos-universal
            runner: macos-latest
            target: universal-apple-darwin
            archive_ext: tar.gz
          - name: windows-x86_64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            archive_ext: zip

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target == 'universal-apple-darwin' && 'aarch64-apple-darwin,x86_64-apple-darwin' || matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.name }}

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-dev pkg-config \
            libxkbcommon-dev libwayland-dev libxcb1-dev \
            libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev

      - name: Build (single target)
        if: matrix.target != 'universal-apple-darwin'
        shell: bash
        run: |
          cargo build --release -p "${PACKAGE}" --target "${{ matrix.target }}"

      - name: Build (macOS universal via lipo)
        if: matrix.target == 'universal-apple-darwin'
        run: |
          cargo build --release -p "${PACKAGE}" --target aarch64-apple-darwin
          cargo build --release -p "${PACKAGE}" --target x86_64-apple-darwin
          mkdir -p "target/universal-apple-darwin/release"
          lipo -create -output "target/universal-apple-darwin/release/${BIN}" \
            "target/aarch64-apple-darwin/release/${BIN}" \
            "target/x86_64-apple-darwin/release/${BIN}"
          lipo -info "target/universal-apple-darwin/release/${BIN}"

      - name: Stage archive and SHA-256 checksum
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME}"
          # workflow_dispatch without a tag: use the short SHA so dry-runs still archive.
          if [[ "${GITHUB_REF_TYPE}" != "tag" ]]; then
            VERSION="sha-${GITHUB_SHA:0:8}"
          fi
          STEM="${BIN}-${VERSION}-${{ matrix.name }}"
          STAGE="dist/${STEM}"
          mkdir -p "${STAGE}"

          EXE="${BIN}"
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            EXE="${BIN}.exe"
          fi
          SRC="target/${{ matrix.target }}/release/${EXE}"
          cp "${SRC}" "${STAGE}/"
          cp LICENSE "${STAGE}/"
          cp README.md "${STAGE}/"

          mkdir -p dist/out
          if [[ "${{ matrix.archive_ext }}" == "zip" ]]; then
            # windows-latest has no `zip(1)`; PowerShell Compress-Archive is reliable.
            powershell.exe -NoProfile -Command \
              "Compress-Archive -Path 'dist/${STEM}' -DestinationPath 'dist/out/${STEM}.zip'"
            ARCHIVE="dist/out/${STEM}.zip"
          else
            tar -C dist -czf "dist/out/${STEM}.tar.gz" "${STEM}"
            ARCHIVE="dist/out/${STEM}.tar.gz"
          fi

          ARCHIVE_NAME="$(basename "${ARCHIVE}")"
          # Portable SHA-256 (sha256sum / shasum / Python).
          if command -v sha256sum >/dev/null 2>&1; then
            (cd dist/out && sha256sum "${ARCHIVE_NAME}" > "${ARCHIVE_NAME}.sha256")
          elif command -v shasum >/dev/null 2>&1; then
            (cd dist/out && shasum -a 256 "${ARCHIVE_NAME}" > "${ARCHIVE_NAME}.sha256")
          else
            python -c "import hashlib, pathlib; p=pathlib.Path(r'''${ARCHIVE}'''); h=hashlib.sha256(p.read_bytes()).hexdigest(); pathlib.Path(str(p)+'.sha256').write_text(f'{h}  {p.name}\n')"
          fi

          echo "VERSION=${VERSION}" >> "${GITHUB_ENV}"
          echo "STEM=${STEM}" >> "${GITHUB_ENV}"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.STEM }}
          path: |
            dist/out/*
          if-no-files-found: error

  publish:
    name: publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all archives
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: List assets
        run: find release-assets -type f | sort

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          generate_release_notes: true
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
